name: Add a paper
description: Suggest a method for the list. We take care of the formatting.
title: "[Paper] "
labels: [add-paper]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing. Submitting this opens a pull request for you, so there is
        no need to fork the repo, edit markdown, or run anything.
  - type: input
    id: abbrev
    attributes:
      label: Abbreviation
      description: Short name the method is known by.
      placeholder: FastV
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: An Image is Worth 1/2 Tokens After Layer 2
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper link
      description: arXiv `abs` page preferred.
      placeholder: https://arxiv.org/abs/2403.06764
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Conference or journal, or `arXiv` for a preprint.
      placeholder: ECCV 2024
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year
      placeholder: "2024"
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Code link
      description: Official repository, if there is one.
      placeholder: https://github.com/pkunlp-icler/FastV
  - type: input
    id: weights
    attributes:
      label: Weights link
      description: Hugging Face collection, Drive folder, or release page, if there is one.
      placeholder: https://huggingface.co/collections/...
  - type: dropdown
    id: section
    attributes:
      label: Where does it belong?
      description: Pick the family whose mechanism it matches. If you are not sure, pick the closest one and we will move it.
      options:
        - 1. Fixed coverage sampling
        - 1. Training-free visual summarization
        - 1. Learned video-only selection
        - 1. Training-free relevance / diversity
        - 1. Learned / generative query-conditioned
        - 2. Shared / unified multimodal encoders
        - 2. Efficient spatiotemporal backbones
        - 2. Linear-complexity / state-space
        - 2. Encoder-internal token reduction
        - 2. Compressed-domain encoding
        - 2. Distilled / compact vision encoders
        - 3. Training-free token pruning & merging
        - 3. Query- / budget-based resampling
        - 3. Spatiotemporal pooling & projection
        - 3. Streaming / memory compression
        - 3. Audio & audio-visual token compression
        - 4. Decoder-layer token pruning & merging
        - 4. Visual KV-cache compression
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Optional. Why it belongs here, or anything we should know.
