name: Paper count badge

on:
  push:
    branches: [main]
    paths: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recount papers and update badge
        run: |
          # ponytail: counts rows in sections 1-4 only; [^0-9] skips the stage-overview table,
          # so a method whose abbreviation starts with a digit would be missed.
          n=$(sed -n '/^## 1\./,/^## Contributing/p' README.md | grep -c '^| \*\*[^0-9]')
          [ "$n" -gt 0 ] || { echo "no table rows matched — row format changed?"; exit 1; }
          sed -i "s|badge/papers-[0-9]*-|badge/papers-$n-|" README.md
          git diff --quiet README.md && { echo "badge already says $n"; exit 0; }
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: update paper count badge to $n"
          git push
