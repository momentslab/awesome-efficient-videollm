name: Paper request

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    # Keyed off the form itself: a label declared in an issue template is dropped
    # silently unless that label already exists in the repo.
    if: contains(github.event.issue.body, '### Where does it belong?')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/issue_to_row.py --self-test
      - name: Skip if a pull request is already open for this issue
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          open=$(gh pr list --head "paper/issue-$NUMBER" --state open --json number --jq 'length')
          echo "exists=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "PR for #$NUMBER already open, nothing to do"
      - name: Add the row
        if: steps.guard.outputs.exists == '0'
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}   # untrusted: passed as env, never inlined
        run: echo "summary=$(python3 scripts/issue_to_row.py)" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        if: steps.guard.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          git diff --quiet README.md && { echo "nothing to add"; exit 0; }
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "paper/issue-$NUMBER"
          git commit -am "docs: add paper requested in #$NUMBER"
          git push -u origin "paper/issue-$NUMBER"
          gh pr create --title "$TITLE" \
            --body "$SUMMARY"$'\n\n'"Opened automatically from #$NUMBER. Closes #$NUMBER."
          gh issue comment "$NUMBER" --body "Thanks. A pull request with this row is open, so there is nothing else to do from your side."
